general {
    lock_cmd         = pidof gtklock || gtklock -d
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

listener {
    timeout          = 600
    on-timeout       = hyprctl switchxkblayout current 0; loginctl lock-session
}

listener {
    timeout          = 1800
    on-timeout       = systemctl suspend
}
